ar cur=document.documentElement.getAttribute("data-theme")||"light";sync(cur);document.querySelectorAll("[data-theme-toggle]").forEach(function(b){b.addEventListener("click",function(){var cur=document.documentElement.getAttribute("data-theme")||"light";var next=cur==="dark"?"light":"dark";apply(next);sync(next);});});});})();</script></body>
