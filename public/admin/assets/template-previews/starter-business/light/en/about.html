    <nav class="main-nav"><a href="../en/home.html" class="nav-logo">YourBusiness</a><ul class="nav-links"><li><a href="../en/home.html">Home</a></li><li><a href="../en/services.html">Services</a></li></ul><button class="theme-switch" data-theme-toggle="true" type="button" aria-label="Toggle light/dark theme" aria-pressed="false"><span class="theme-switch-icon" aria-hidden="true">🌙</span><span class="theme-switch-label">Dark mode</span></button></nav><section class="page-header"><h1>About Us</h1><p>Learn more about our story</p></section><section class="about-content"><img class="photo about-photo" src="../../assets/images/starter-business-meeting.webp" alt="A small meeting table set for a conversation, by a window." width="1200" height="800"><h2>Our Story</h2><p>Founded with a vision to deliver excellence...</p></section><footer class="main-footer"><div class="footer-content"><div class="footer-brand"><span class="footer-logo">YourBusiness</span><p>Excellence in every detail</p></div><nav class="footer-nav"><a href="../en/about.html">About</a><a href="../en/contact.html">Contact</a></nav><div class="footer-lang"><span class="lang-label">Language:</span><div class="lang-switch"><a href="../en/about.html" class="lang-btn" data-lang="en">English</a><a href="../fr/about.html" class="lang-btn" data-lang="fr">Français</a></div></div></div><div class="footer-bottom"><p>2025 YourBusiness. All rights reserved.</p></div></footer>        <script>(function(){var key="qs-theme-template-preview";function apply(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(key,t);}catch(e){}}function sync(t){document.querySelectorAll("[data-theme-toggle]").forEach(function(b){var icon=b.querySelector(".theme-switch-icon");var lbl=b.querySelector(".theme-switch-label");if(icon)icon.textContent=t==="dark"?"☀️":"🌙";if(lbl)lbl.textContent=t==="dark"?"Light mode":"Dark mode";b.setAttribute("aria-pressed",t==="dark"?"true":"false");});}document.addEventListener("DOMContentLoaded",function(){var cur=document.documentElement.getAttribute("data-theme")||"light";sync(cur);document.querySelectorAll("[data-theme-toggle]").forEach(function(b){b.addEventListener("click",function(){var cur=document.documentElement.getAttribute("data-theme")||"light";var next=cur==="dark"?"light":"dark";apply(next);sync(next);});});});})();</script></body>
